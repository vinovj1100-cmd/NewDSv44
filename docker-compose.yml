version: "3.9"

services:
  neural-app:
    build: .
    ports:
      - "8501:8501"
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./warehouse_neural.db:/app/warehouse_neural.db
    environment:
      - WMS_DB_PATH=/app/warehouse_neural.db
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./mobile/static:/usr/share/nginx/html/static:ro
      - ./mobile/templates:/usr/share/nginx/html/templates:ro
    depends_on:
      - neural-app
    restart: unless-stopped
